name: NPM_TOKEN expiry reminder

# NPM_TOKEN (alsel-find-skills の publish に使用) の期限切れを
# 毎月 1 日に確認し、残り 30 日以下になったら GitHub Issue を自動作成する。
# EXPIRY_DATE を更新したら、トークン再発行 + GitHub Secret 差し替え後に
# このファイルの値も書き直してください。

on:
  schedule:
    - cron: "0 0 1 * *"  # 毎月 1 日 00:00 UTC = 09:00 JST
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      EXPIRY_DATE: "2026-08-12"
      THRESHOLD_DAYS: "30"
    steps:
      - name: Calculate days left
        id: calc
        run: |
          EXPIRY_TS=$(date -u -d "$EXPIRY_DATE" +%s)
          NOW_TS=$(date -u +%s)
          DAYS_LEFT=$(( (EXPIRY_TS - NOW_TS) / 86400 ))
          echo "days_left=$DAYS_LEFT" >> "$GITHUB_OUTPUT"
          echo "Days left until $EXPIRY_DATE: $DAYS_LEFT"
          if [ "$DAYS_LEFT" -le "$THRESHOLD_DAYS" ]; then
            echo "should_warn=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_warn=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for existing open reminder issue
        id: existing
        if: steps.calc.outputs.should_warn == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --state open \
            --search "in:title NPM_TOKEN expires on ${EXPIRY_DATE}" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found existing reminder issue #$EXISTING — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create reminder issue
        if: steps.calc.outputs.should_warn == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS_LEFT: ${{ steps.calc.outputs.days_left }}
        run: |
          TITLE="NPM_TOKEN expires on ${EXPIRY_DATE} (${DAYS_LEFT} days left)"
          BODY=$(cat <<EOF
          ## NPM_TOKEN の期限切れが近づいています

          - **期限**: ${EXPIRY_DATE}
          - **残り日数**: ${DAYS_LEFT} 日
          - **影響**: 期限切れ後は \`alsel-find-skills\` の自動 publish (\`publish-find-skills.yml\`) が失敗します

          ### 対応手順

          1. **新しい NPM_TOKEN を発行**
             - https://www.npmjs.com → Account → Access Tokens
             - "Generate New Token" → **Classic Token / Automation**
             - 期限を 1 年後等で再設定
             - 表示されたトークン (\`npm_xxxx...\`) をコピー (再表示不可)

          2. **GitHub Secret を更新**
             - https://github.com/takehirosaito/agent-skills-jp/settings/secrets/actions
             - \`NPM_TOKEN\` を選んで **Update secret** に貼り付け

          3. **このリポジトリの EXPIRY_DATE を書き換え**
             - \`.github/workflows/npm-token-reminder.yml\` の \`EXPIRY_DATE\` を新しい期限日に更新して push

          4. **動作確認 (任意)**
             - \`gh workflow run publish-find-skills.yml -f bump=patch\` で手動 publish が成功すれば OK

          このリマインダーは毎月 1 日に自動チェックします。対応完了後はこの Issue を close してください。
          EOF
          )
          gh issue create \
            --title "$TITLE" \
            --body "$BODY"
