version: "3.8"

# ============================================================
# Meilisearch セットアップ
# ============================================================
# 本番: Hetzner VPS ($5/月、2GB RAM) で十分
# 起動: docker compose up -d
# 確認: curl http://localhost:7700/health
# ============================================================

services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: agent-skills-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?Set strong master key in .env}"
      MEILI_ENV: "production"
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: "/meili_data"
      MEILI_HTTP_ADDR: "0.0.0.0:7700"
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # オプション: 管理UI(開発時のみ)
  meili-admin:
    image: riccoxie/meilisearch-ui:latest
    container_name: agent-skills-meili-admin
    restart: unless-stopped
    ports:
      - "24900:24900"
    profiles:
      - dev

volumes:
  meili_data:
    driver: local
