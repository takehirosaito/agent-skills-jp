<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ロゴマーク -->
  <rect x="80" y="80" width="120" height="120" rx="28" fill="url(#mark)"/>
  <text x="140" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="56" fill="white" letter-spacing="-2">AS</text>

  <!-- 縦線 -->
  <line x1="240" y1="100" x2="240" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <!-- サイト名 -->
  <text x="260" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="28" fill="#64748b">AI時代のスキル大全。</text>
  <text x="260" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="48" fill="#0f172a" letter-spacing="-1">Agent Skills <tspan fill="#2563eb">by ALSEL</tspan></text>

  <!-- メイン -->
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="64" fill="#0f172a" letter-spacing="-2">世界中の Agent Skills を、</text>
  <text x="80" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="64" fill="#0f172a" letter-spacing="-2">日本語で探す。</text>

  <!-- サブ -->
  <text x="80" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="28" fill="#475569">約 6,800 件の Agent Skills を日本語で検索・比較できる専門データベース</text>

  <!-- URL -->
  <text x="80" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="26" fill="#64748b">agent-skills.jp</text>
</svg>
